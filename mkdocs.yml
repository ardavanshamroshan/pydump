site_name: pydump
site_description: Structured dump-and-die for Python — terminal only, stdlib only
site_url: https://ardavanshamroshan.github.io/pydump/
repo_url: https://github.com/ardavanshamroshan/pydump
repo_name: ardavanshamroshan/pydump
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Ardavan — MIT License

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ardavanshamroshan/pydump
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pydump-dd/
  alternate:
    - link: /
      lang: en
      name: English
    - link: /fa/
      lang: fa
      name: فارسی

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
          theme:
            language: en
          nav:
            - Home: index.md
            - Getting Started: getting-started.md
            - Installation: installation.md
            - Features: features.md
            - API Reference: api.md
            - Demo: demo.md
            - Upgrade Guide: upgrade.md
            - Changelog: changelog.md
        - locale: fa
          name: فارسی
          build: true
          theme:
            language: fa
          nav:
            - خانه: index.md
            - شروع سریع: getting-started.md
            - نصب: installation.md
            - امکانات: features.md
            - مرجع API: api.md
            - دمو: demo.md
            - راهنمای ارتقا: upgrade.md
            - تغییرات: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md

[project]
name = "pydump-dd"
version = "0.2.4"
description = "Structured dump-and-die for Python — terminal (ANSI) only, stdlib only"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ardavan" }]
keywords = ["debug", "dump", "dd", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://ardavanshamroshan.github.io/pydump/"
Documentation = "https://ardavanshamroshan.github.io/pydump/"
Repository = "https://github.com/ardavanshamroshan/pydump"
Issues = "https://github.com/ardavanshamroshan/pydump/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydump"]

[tool.hatch.build.targets.sdist]
include = ["src/pydump", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
